openapi: 3.0.3
info:
  title: PrepHub API
  version: 0.1.0
  description: |
    Contract-first API for PrepHub. Change this file first, then the code.
    Errors use RFC 9457 problem details (`application/problem+json`).
    Auth: the bearer token is a Supabase-issued JWT from the frontend's Supabase session.
    This API validates that token; it never issues or verifies Google credentials itself.
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
tags:
  - name: Profile
  - name: Extractions
  - name: Experiences
  - name: Questions
  - name: Reference
security:
  - bearerAuth: []

paths:
  /me:
    get:
      tags: [Profile]
      operationId: getCurrentUser
      summary: Current user profile (created on first call if it doesn't exist yet)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /extractions:
    post:
      tags: [Extractions]
      operationId: createExtraction
      summary: Submit raw pasted text for AI extraction
      description: Returns immediately with a job. Poll `GET /extractions/{jobId}` until status is SUCCEEDED or FAILED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExtractionRequest'
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /extractions/{jobId}:
    get:
      tags: [Extractions]
      operationId: getExtraction
      summary: Get extraction job status and result
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /extractions/{jobId}/publish:
    post:
      tags: [Extractions]
      operationId: publishExtraction
      summary: Publish the (user-reviewed/edited) extraction result as an experience
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperienceInput'
      responses:
        '201':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experience'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Job not finished, or already published
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /experiences:
    get:
      tags: [Experiences]
      operationId: listExperiences
      summary: Browse and search published experiences
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: q
          in: query
          description: Full-text search
          schema: { type: string, maxLength: 200 }
        - name: company
          in: query
          description: Company slug
          schema: { type: string }
        - name: topic
          in: query
          description: Topic slug (repeatable)
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: level
          in: query
          schema: { $ref: '#/components/schemas/Level' }
        - name: outcome
          in: query
          schema: { $ref: '#/components/schemas/Outcome' }
        - name: year
          in: query
          schema: { type: integer }
        - name: sort
          in: query
          schema: { type: string, enum: [newest, oldest], default: newest }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperiencePage'

  /experiences/{experienceId}:
    parameters:
      - $ref: '#/components/parameters/ExperienceId'
    get:
      tags: [Experiences]
      operationId: getExperience
      summary: Get one experience with rounds and questions
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experience'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Experiences]
      operationId: updateExperience
      summary: Replace an experience you authored
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperienceInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experience'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Experiences]
      operationId: deleteExperience
      summary: Delete an experience you authored
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /questions:
    get:
      tags: [Questions]
      operationId: listQuestions
      summary: Browse and search questions across experiences
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: company
          in: query
          schema: { type: string }
        - name: topic
          in: query
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: difficulty
          in: query
          schema: { $ref: '#/components/schemas/Difficulty' }
        - name: sort
          in: query
          schema: { type: string, enum: [newest], default: newest }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionPage'

  /questions/{questionId}:
    get:
      tags: [Questions]
      operationId: getQuestion
      summary: Get one question
      security: []
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '404':
          $ref: '#/components/responses/NotFound'

  /topics:
    get:
      tags: [Reference]
      operationId: listTopics
      summary: Topic taxonomy
      security: []
      parameters:
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/TopicKind' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Topic' }

  /companies:
    get:
      tags: [Reference]
      operationId: searchCompanies
      summary: Search companies by name or alias (autocomplete)
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Company' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase-issued JWT, validated (not issued) by this API.

  parameters:
    Page:
      name: page
      in: query
      description: Zero-based page index
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExperienceId:
      name: experienceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    QuestionId:
      name: questionId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Validation error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Not allowed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ----- Enums -----
    Level:
      type: string
      enum: [INTERN, JUNIOR, MID, SENIOR, LEAD, PRINCIPAL]
    InterviewMode:
      type: string
      enum: [ONSITE, REMOTE, HYBRID]
    Outcome:
      type: string
      enum: [SELECTED, REJECTED, PENDING, UNKNOWN]
    RoundType:
      type: string
      enum: [ONLINE_ASSESSMENT, TECHNICAL, MACHINE_CODING, SYSTEM_DESIGN, MANAGERIAL, HR, BEHAVIORAL, OTHER]
    QuestionType:
      type: string
      enum: [THEORY, CODING, SYSTEM_DESIGN, BEHAVIORAL, SCENARIO, OTHER]
    Difficulty:
      type: string
      enum: [EASY, MEDIUM, HARD]
    TopicKind:
      type: string
      enum: [LANGUAGE, FRAMEWORK, CONCEPT, DATABASE, SYSTEM_DESIGN, DSA, DEVOPS, BEHAVIORAL, OTHER]
    JobStatus:
      type: string
      enum: [QUEUED, RUNNING, SUCCEEDED, FAILED]

    # ----- Profile -----
    User:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }

    # ----- Reference -----
    Topic:
      type: object
      required: [slug, name, kind]
      properties:
        slug: { type: string }
        name: { type: string }
        kind: { $ref: '#/components/schemas/TopicKind' }
    Company:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }

    # ----- Extraction -----
    CreateExtractionRequest:
      type: object
      required: [rawText]
      properties:
        rawText: { type: string, minLength: 100, maxLength: 10000 }
    ExtractionJob:
      type: object
      required: [id, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/JobStatus' }
        result:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/ExtractionResult' }]
        errorCode: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
    ExtractionResult:
      type: object
      required: [isInterviewContent, confidence, experience, warnings]
      properties:
        isInterviewContent: { type: boolean }
        confidence: { type: number, minimum: 0, maximum: 1 }
        experience: { $ref: '#/components/schemas/ExperienceInput' }
        suggestedNewTopics: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }

    # ----- Experience -----
    ExperienceInput:
      type: object
      required: [outcome, rounds]
      properties:
        companyName: { type: string, nullable: true, maxLength: 120 }
        roleTitle: { type: string, nullable: true, maxLength: 120 }
        level: { allOf: [{ $ref: '#/components/schemas/Level' }], nullable: true }
        yearsOfExperience: { type: number, nullable: true, minimum: 0, maximum: 60 }
        location: { type: string, nullable: true, maxLength: 120 }
        interviewYear: { type: integer, nullable: true, minimum: 2000, maximum: 2100 }
        interviewMonth: { type: integer, nullable: true, minimum: 1, maximum: 12 }
        interviewMode: { allOf: [{ $ref: '#/components/schemas/InterviewMode' }], nullable: true }
        outcome: { $ref: '#/components/schemas/Outcome' }
        summary: { type: string, nullable: true, maxLength: 1000 }
        isAnonymous: { type: boolean, default: false }
        rounds:
          type: array
          minItems: 1
          maxItems: 15
          items: { $ref: '#/components/schemas/RoundInput' }
    RoundInput:
      type: object
      required: [roundNumber, roundType, questions]
      properties:
        roundNumber: { type: integer, minimum: 1 }
        roundType: { $ref: '#/components/schemas/RoundType' }
        durationMinutes: { type: integer, nullable: true, minimum: 1 }
        notes: { type: string, nullable: true, maxLength: 1000 }
        questions:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/QuestionInput' }
    QuestionInput:
      type: object
      required: [text, questionType, topicSlugs]
      properties:
        text: { type: string, minLength: 5, maxLength: 1000 }
        questionType: { $ref: '#/components/schemas/QuestionType' }
        difficulty: { allOf: [{ $ref: '#/components/schemas/Difficulty' }], nullable: true }
        topicSlugs: { type: array, maxItems: 5, items: { type: string } }

    Experience:
      type: object
      required: [id, outcome, rounds, createdAt]
      properties:
        id: { type: string, format: uuid }
        author:
          nullable: true
          description: Null when the experience is anonymous.
          allOf: [{ $ref: '#/components/schemas/User' }]
        isAnonymous: { type: boolean }
        company:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Company' }]
        roleTitle: { type: string, nullable: true }
        level: { allOf: [{ $ref: '#/components/schemas/Level' }], nullable: true }
        yearsOfExperience: { type: number, nullable: true }
        location: { type: string, nullable: true }
        interviewYear: { type: integer, nullable: true }
        interviewMonth: { type: integer, nullable: true }
        interviewMode: { allOf: [{ $ref: '#/components/schemas/InterviewMode' }], nullable: true }
        outcome: { $ref: '#/components/schemas/Outcome' }
        summary: { type: string, nullable: true }
        rounds: { type: array, items: { $ref: '#/components/schemas/Round' } }
        createdAt: { type: string, format: date-time }
    Round:
      type: object
      required: [roundNumber, roundType, questions]
      properties:
        roundNumber: { type: integer }
        roundType: { $ref: '#/components/schemas/RoundType' }
        durationMinutes: { type: integer, nullable: true }
        notes: { type: string, nullable: true }
        questions: { type: array, items: { $ref: '#/components/schemas/Question' } }
    Question:
      type: object
      required: [id, text, questionType, topics]
      properties:
        id: { type: string, format: uuid }
        experienceId: { type: string, format: uuid }
        text: { type: string }
        questionType: { $ref: '#/components/schemas/QuestionType' }
        difficulty: { allOf: [{ $ref: '#/components/schemas/Difficulty' }], nullable: true }
        topics: { type: array, items: { $ref: '#/components/schemas/Topic' } }
        company:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Company' }]

    # ----- Pagination -----
    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    ExperiencePage:
      type: object
      required: [content, page]
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/Experience' } }
        page: { $ref: '#/components/schemas/PageMeta' }
    QuestionPage:
      type: object
      required: [content, page]
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/Question' } }
        page: { $ref: '#/components/schemas/PageMeta' }

    # ----- Errors -----
    Problem:
      type: object
      description: RFC 9457 problem details
      required: [title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
